<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HFBCcc | Passagem de Plantão</title>
<style>
:root {
  --azul:#075fae; --azul-escuro:#123b62; --verde:#16a085;
  --texto:#23384d; --cinza:#68798a; --linha:#d8e2eb; --fundo:#f4f7fa; --branco:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);font-family:Arial,Helvetica,sans-serif;color:var(--texto)}
.app{max-width:1120px;margin:auto;padding:20px}
.header{background:#fff;border:1px solid var(--linha);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:18px;box-shadow:0 5px 18px rgba(20,50,80,.07)}
.logo{width:82px;height:82px;object-fit:contain}
.brand{flex:1}
.brand h1{font-size:22px;margin:0 0 4px;color:var(--azul-escuro);font-weight:800;letter-spacing:.1px}
.brand p{margin:0;color:var(--cinza);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;font-size:13px}
.btn-primary{background:var(--azul);color:white}
.btn-whats{background:#128c7e;color:#fff}
.btn-light{background:#edf4f9;color:var(--azul-escuro)}
.btn-danger{background:#fff0f0;color:#b42318;padding:7px 10px}
.meta{display:grid;grid-template-columns:1.5fr 1fr .8fr;gap:10px;margin:12px 0}
.field,.section{background:var(--branco);border:1px solid var(--linha);border-radius:13px}
.field{padding:10px 12px}
label.caption{display:block;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--cinza);margin-bottom:5px}
input,textarea,select{width:100%;border:1px solid #cbd8e3;border-radius:8px;background:#fff;padding:9px 10px;color:var(--texto);font:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--azul);box-shadow:0 0 0 2px #075fae18}
.section{margin:10px 0;overflow:hidden}
.section-title{padding:10px 13px;border-bottom:1px solid var(--linha);background:#f8fafc;display:flex;align-items:center;justify-content:space-between}
.section-title h2{font-size:14px;margin:0;color:var(--azul-escuro)}
.section-body{padding:11px 13px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:1fr 135px 36px;gap:7px}
.row input{min-width:0}
.add{margin-top:8px}
.checks{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.check{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600}
.check input{width:17px;height:17px}
.temp-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.status{display:flex;gap:7px;flex-wrap:wrap}
.status label{border:1px solid var(--linha);border-radius:8px;padding:8px 10px;font-size:12px;background:#fff}
.status input{width:auto;margin-right:4px}
.footer{text-align:center;color:#7a8a99;font-size:10px;padding:12px}
@media(max-width:760px){
 .app{padding:10px} .header{align-items:flex-start} .logo{width:62px;height:62px}
 .brand h1{font-size:18px} .actions{width:100%} .actions button{flex:1}
 .meta,.temp-grid{grid-template-columns:1fr} .row{grid-template-columns:1fr 100px 34px}
}
@media print{
 @page{size:A4;margin:7mm}
 body{background:#fff} .app{max-width:none;padding:0}
 .header{box-shadow:none;border:0;border-bottom:1px solid #aaa;border-radius:0;padding:0 0 6px}
 .logo{width:55px;height:55px} .brand h1{font-size:16px} .brand p{font-size:9px}
 .actions,.add,.delete,.footer{display:none!important}
 .meta{margin:5px 0;gap:5px} .field{padding:5px 7px;border-radius:5px}
 label.caption{font-size:7px;margin-bottom:2px} input,select{padding:3px 5px;font-size:9px}
 .section{margin:4px 0;border-radius:5px;break-inside:avoid}
 .section-title{padding:5px 7px} .section-title h2{font-size:9px}
 .section-body{padding:5px 7px} .rows{gap:2px} .row{grid-template-columns:1fr 75px 0;gap:3px}
 .row input{padding:2px 4px;font-size:8px}
 .status label,.check{font-size:8px;padding:4px 6px}
 textarea{min-height:42px;font-size:8px;padding:4px}
}
</style>

  <div class="brand">
    <h1>Passagem de Plantão</h1>
    <p>HFBCcc — Farmácia Hemodinâmica</p>
  </div>
  <div class="actions">
    <button class="btn-light" onclick="novoPlantao()">Novo plantão</button>
    <button class="btn-light" onclick="salvar()">Salvar</button>
    <button class="btn-whats" onclick="compartilharWhatsApp()">WhatsApp</button>
    <button class="btn-primary" onclick="window.print()">Imprimir / PDF</button>
  </div>
</header>

<div class="meta">
  <div class="field"><label class="caption">Auxiliar do plantão</label><input id="aux" placeholder="Digite o nome"></div>
  <div class="field"><label class="caption">Data</label><input id="data" type="date"></div>
  <div class="field"><label class="caption">Turno</label><select id="turno"><option value="">Selecione</option><option>Diurno</option><option>Noturno</option><option>12x36</option><option>Outro</option></select></div>
</div>

<section class="section">
 <div class="section-title"><h2>Medicamentos fracionados</h2></div>
 <div class="section-body"><div id="fracionados" class="rows"></div><button class="btn-light add" onclick="addRow('fracionados')">+ Adicionar medicamento</button></div>
</section>

<section class="section">
 <div class="section-title"><h2>Reposição de materiais e medicamentos</h2></div>
 <div class="section-body"><div id="reposicao" class="rows"></div><button class="btn-light add" onclick="addRow('reposicao')">+ Adicionar item</button></div>
</section>

<section class="section">
 <div class="section-title"><h2>Controle de temperatura</h2></div>
 <div class="section-body">
  <div class="temp-grid">
   <div class="status">
    <label><input type="radio" name="temp" value="Realizado"> Realizado</label>
    <label><input type="radio" name="temp" value="Não realizado"> Não realizado</label>
   </div>
   <input id="tempObs" placeholder="Observação, se necessário">
  </div>
 </div>
</section>

<section class="section">
 <div class="section-title"><h2>Montagem de kits</h2></div>
 <div class="section-body"><div id="kits" class="rows"></div><button class="btn-light add" onclick="addRow('kits')">+ Adicionar kit</button></div>
</section>

<section class="section">
 <div class="section-title"><h2>Medicamentos das 08:00</h2></div>
 <div class="section-body">
  <div class="checks">
   <label class="check"><input type="checkbox" id="uti"> Separados — UTI</label>
   <label class="check"><input type="checkbox" id="enf"> Separados — Enfermaria</label>
   <label class="check"><input type="checkbox" id="pend08"> Houve pendência</label>
  </div>
  <input id="med08obs" style="margin-top:8px" placeholder="Detalhes ou pendências">
 </div>
</section>


<section class="section">
 <div class="section-title"><h2>Baixo estoque</h2></div>
 <div class="section-body">
  <div id="baixoEstoque" class="rows"></div>
  <button class="btn-light add" onclick="addRow('baixoEstoque')">+ Adicionar item</button>
 </div>
</section>

<section class="section">
 <div class="section-title"><h2>Observações e pendências</h2></div>
 <div class="section-body"><textarea id="obs" placeholder="Digite aqui as informações que precisam ser repassadas ao próximo plantão..."></textarea></div>
</section>

<div class="footer">HFBCcc — Farmácia Hemodinâmica | Passagem de Plantão</div>
</div>

<script>
const ids = ['aux','data','turno','tempObs','uti','enf','pend08','med08obs','obs'];

function esc(v) {
 return String(v||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}
function addRow(id,item='',tag='') {
 const box=document.getElementById(id);
 const d=document.createElement('div'); d.className='row';
 d.innerHTML='<input class="item" placeholder="Digite o item..." value="'+esc(item)+'">'+
 '<input class="tag" placeholder="Status" value="'+esc(tag)+'">'+
 '<button class="btn-danger delete" onclick="this.parentElement.remove()">×</button>';
 box.appendChild(d);
}
function rows(id) {
 return [...document.querySelectorAll('#'+id+' .row')].map(r=>({
   item:r.querySelector('.item').value.trim(),
   tag:r.querySelector('.tag').value.trim()
 })).filter(x=>x.item);
}
function hojeBR() {
 const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
 return d.toISOString().slice(0,10);
}
function novoPlantao() {
 if(confirm('Começar um novo plantão? Os dados preenchidos atualmente serão apagados da tela.')) {
   localStorage.removeItem('hfbc_plantao');
   document.querySelectorAll('input,textarea').forEach(e=>{if(e.type==='checkbox'||e.type==='radio')e.checked=false;else e.value='';});
   document.getElementById('turno').value='';
   ['fracionados','reposicao','kits','baixoEstoque'].forEach(id=>document.getElementById(id).innerHTML='');
   document.getElementById('data').value=hojeBR();
 }
}
function objeto() {
 return {
  aux:aux.value,data:dataEl.value,turno:turno.value,
  fracionados:rows('fracionados'),reposicao:rows('reposicao'),kits:rows('kits'),baixoEstoque:rows('baixoEstoque'),
  temp:[...document.querySelectorAll('input[name=temp]')].find(x=>x.checked)?.value||'',
  tempObs:tempObs.value,uti:uti.checked,enf:enf.checked,pend08:pend08.checked,
  med08obs:med08obs.value,obs:obs.value
 };
}
function salvar() {
 localStorage.setItem('hfbc_plantao',JSON.stringify(objeto()));
 alert('Passagem de plantão salva neste dispositivo.');
}
function carregar() {
 const s=localStorage.getItem('hfbc_plantao');
 if(!s) { dataEl.value=hojeBR(); return; }
 try {
  const d=JSON.parse(s);
  aux.value=d.aux||''; dataEl.value=d.data||hojeBR(); turno.value=d.turno||'';
  ['fracionados','reposicao','kits','baixoEstoque'].forEach(id=>document.getElementById(id).innerHTML='');
  (d.fracionados||[]).forEach(x=>addRow('fracionados',x.item,x.tag));
  (d.reposicao||[]).forEach(x=>addRow('reposicao',x.item,x.tag));
  (d.kits||[]).forEach(x=>addRow('kits',x.item,x.tag)); (d.baixoEstoque||[]).forEach(x=>addRow('baixoEstoque',x.item,x.tag));
  document.querySelectorAll('input[name=temp]').forEach(x=>x.checked=x.value===d.temp);
  tempObs.value=d.tempObs||''; uti.checked=!!d.uti; enf.checked=!!d.enf; pend08.checked=!!d.pend08;
  med08obs.value=d.med08obs||''; obs.value=d.obs||'';
 } catch(e) { dataEl.value=hojeBR(); }
}
function dataBR(v) {
 if(!v) return '';
 const [a,m,d]=v.split('-'); return d+'/'+m+'/'+a;
}
function compartilharWhatsApp() {
 const d=objeto();
 let t='*HFBCcc — Farmácia Hemodinâmica*\n*PASSAGEM DE PLANTÃO*\n\n';
 t+='*Auxiliar:* '+(d.aux||'—')+'\n*Data:* '+dataBR(d.data)+'\n*Turno:* '+(d.turno||'—')+'\n\n';
 const bloco=(titulo,arr)=>{ if(!arr.length)return; t+='*'+titulo+'*\n'; arr.forEach(x=>t+='• '+x.item+(x.tag?' — '+x.tag:'')+'\n'); t+='\n'; };
 bloco('Medicamentos fracionados',d.fracionados);
 bloco('Reposição de materiais e medicamentos',d.reposicao);
 if(d.temp||d.tempObs) t+='*Controle de temperatura:* '+(d.temp||'—')+(d.tempObs?' — '+d.tempObs:'')+'\n\n';
 bloco('Montagem de kits',d.kits); bloco('Baixo estoque',d.baixoEstoque||[]);
 t+='*Medicamentos das 08:00:*\n';
 t+=(d.uti?'• UTI: separados\n':'')+(d.enf?'• Enfermaria: separados\n':'')+(d.pend08?'• Houve pendência\n':'');
 if(d.med08obs)t+='• '+d.med08obs+'\n'; t+='\n';
 if(d.obs)t+='*Observações e pendências:*\n'+d.obs+'\n';
 const url='https://wa.me/?text='+encodeURIComponent(t);
 window.open(url,'_blank');
}
const aux=document.getElementById('aux'),dataEl=document.getElementById('data'),turno=document.getElementById('turno'),
tempObs=document.getElementById('tempObs'),uti=document.getElementById('uti'),enf=document.getElementById('enf'),
pend08=document.getElementById('pend08'),med08obs=document.getElementById('med08obs'),obs=document.getElementById('obs');
carregar();
</script>
</body>
</html>
